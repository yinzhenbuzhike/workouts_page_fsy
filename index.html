<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const basePath = '%BASE_URL%';
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          if (
            redirect !== basePath + '/' &&
            redirect !== basePath + '/index.html'
          ) {
            window.history.pushState(null, '', redirect);
          }
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/png"
      href="https://pub-91575f75878d40de9acc9395c2ce673a.r2.dev/%E9%87%91%E6%99%BA%E5%AA%9B.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>晚风踏星河的运动记录</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
